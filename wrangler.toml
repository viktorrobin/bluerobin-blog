name = "bluerobin-blog"
compatibility_date = "2026-02-26"

# Cloudflare Workers with static assets (migrated from Pages)
# Astro static build outputs to ./dist
# Deployed via Workers Builds (GitHub push → auto build & deploy)
# Custom domain: blog.bluerobin.io

# Worker entry — handles API routes (POST /api/request-access). With static
# assets configured below, Cloudflare serves matching files FIRST and only
# invokes this Worker for non-asset paths, so asset hits stay free/fast.
main = "src/worker/index.ts"

# Preview URLs for non-production branches (top-level key, not under [assets])
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Secrets are NOT stored here. Set per environment (dashboard or wrangler):
#   wrangler secret put TURNSTILE_SECRET_KEY          # required
#   # ntfy channel (self-hosted): https://ntfy.bluerobin.io/<topic>
#   wrangler secret put NTFY_BLOG_URL
#   wrangler secret put NTFY_BLOG_TOKEN                     # publish token for the topic
#   # email channel (Brevo): reply-to is set to the requester
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put CONTACT_TO_EMAIL              # optional, default victor@bluerobin.io
#   wrangler secret put CONTACT_FROM_EMAIL            # optional, default noreply@bluerobin.io
# At least one of {NTFY_BLOG_URL, BREVO_API_KEY} must be set. Local dev reads
# .dev.vars (git-ignored). The PUBLIC Turnstile site key is hardcoded in the form
# component (it's not secret); override with build var PUBLIC_TURNSTILE_SITE_KEY.
